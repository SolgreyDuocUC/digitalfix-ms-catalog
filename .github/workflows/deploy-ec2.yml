name: "Build, Push & Dispatch"

on:
  push:
    branches: [ deploy ]
  workflow_dispatch: # Permite ejecutar el flujo manualmente desde la pestaña Actions

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar paquete JAR
        run: mvn clean package -DskipTests

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest

      - name: Notificar al Repositorio de Infraestructura
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT_INFRA }}
          repository: SolgreyDuocUC/digitalfix-infrastructure
          event-type: microservice-updated
          client_payload: '{"service": "${{ github.event.repository.name }}"}'
