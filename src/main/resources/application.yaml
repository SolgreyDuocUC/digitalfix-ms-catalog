# Swagger UI - Documentación de la API: http://localhost:8088/swagger-ui.html

spring:
  application:
    name: digitalfix-ms-catalog

  # Carga el archivo .env de la raiz del proyecto (si existe)
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Definida en .env, ej: jdbc:oracle:thin:@<alias>_high?TNS_ADMIN=./wallet
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        # Relaciones LAZY en lotes de hasta 100 (IN) en vez de una consulta por fila: evita el N+1
        # en los listados, que contra Oracle Autonomous cuesta ~40 ms de red por consulta.
        default_batch_fetch_size: 100
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_catalog
    locations: classpath:db/migration

# Puerto local configurable desde .env (SERVER_PORT=8088; el 8084 es de ms-admin-queues y el 8086 está reservado para ms-report).
# En Docker queda en 8080 y solo es accesible por la red interna (BFF y ms-workorders).
server:
  port: ${SERVER_PORT:8088}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

# ms-user: fuente del rol de negocio (USUARIOS/ROLES) para la autorizacion por rol.
# En Docker MS_USER_URL apunta al contenedor (http://ms-user-service:8082).
digitalfix:
  ms-user:
    url: ${MS_USER_URL:http://localhost:8082}
